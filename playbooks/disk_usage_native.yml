---
- name: Run ServiceNow Incident Python Script in AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Default variables if not provided via AAP Survey or Extra Vars
    incident_summary: "Disk Usage Alert Generated by AAP"
    incident_detail: "High Disk Usage Report"
    incident_urgency: "3"
    incident_impact: "3"

  tasks:
    - name: Execute Python script to create incident
      ansible.builtin.script: files/create_snow.py
      args:
        executable: python3
      environment:
        # Injected automatically by your AAP Custom Credential:
        SN_USERNAME: "{{ lookup('env', 'SN_USERNAME') }}"
        SN_PASSWORD: "{{ lookup('env', 'SN_PASSWORD') }}"
        # Custom dynamic fields passed down to script environment:
        INCIDENT_SUMMARY: "{{ incident_summary }}"
        INCIDENT_DETAIL: "{{ incident_detail }}"
        INCIDENT_URGENCY: "{{ incident_urgency }}"
        INCIDENT_IMPACT: "{{ incident_impact }}"
      register: script_output

    - name: Parse and log ServiceNow response
      ansible.builtin.debug:
        msg: "{{ script_output.stdout | from_json }}"
