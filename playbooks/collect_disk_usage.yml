---
- name: Collect Disk Usage via Python Script and Open ServiceNow Incident
  hosts: rhel_servers
  gather_facts: false

  tasks:
    - name: Run local Python script on target remote nodes
      ansible.builtin.script: files/get_disk_usage.py
      register: script_output

    - name: Parse and display structured JSON output
      ansible.builtin.debug:
        msg: "{{ script_output.stdout | from_json }}"

    - name: Set disk data fact
      ansible.builtin.set_fact:
        disk_payload: "{{ script_output.stdout | from_json }}"

    - name: Create ServiceNow Incident
      servicenow.itsm.incident:
        state: new
        caller: tory.ellis
        short_description: "Disk Usage Report: {{ disk_payload.hostname }}"
        description: |
          AUTOMATED DISK USAGE REPORT
          ===========================
          Host: {{ disk_payload.hostname }}

          Formatted Payload:
          {{ disk_payload | to_nice_json }}
        impact: low
        urgency: low
      delegate_to: localhost
      register: servicenow_result

    - name: Display created incident number
      ansible.builtin.debug:
        msg: "ServiceNow Incident Created: {{ servicenow_result.record.number }}"
